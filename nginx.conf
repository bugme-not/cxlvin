worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections 161072;
    multi_accept on;
    use epoll;
}

http {
    http2_max_concurrent_streams 1024;
    aio threads;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    client_max_body_size 0;
    client_body_timeout 30;
    client_header_timeout 30;
    send_timeout 300;
    proxy_connect_timeout 10;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    proxy_socket_keepalive on;
    proxy_buffering off;
    proxy_request_buffering off;
    chunked_transfer_encoding off;
    server_tokens off;

    resolver 1.1.1.1 223.5.5.5 8.8.8.8 valid=86400s;
    resolver_timeout 1s;
    proxy_ssl_session_reuse on;
    reset_timedout_connection on;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml text/javascript;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream trojan_ws       { server [::1]:10001; keepalive 256; }
    upstream vless_ws        { server [::1]:10002; keepalive 256; }
    upstream shadowsocks_ws  { server [::1]:10003; keepalive 256; }
    upstream vmess_ws        { server [::1]:10004; keepalive 256; }

    upstream trojan_hu       { server [::1]:11001; keepalive 256; }
    upstream vless_hu        { server [::1]:11002; keepalive 256; }
    upstream shadowsocks_hu  { server [::1]:11003; keepalive 256; }
    upstream vmess_hu        { server [::1]:11004; keepalive 256; }

    server {
        listen 8080 default_server reuseport backlog=65535;
        listen [::]:8080 default_server reuseport backlog=65535;
        server_name _;
        http2 on;

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        location / {
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_pass https://cxlvin-cfw.gattoux0.workers.dev;
            proxy_set_header Host cxlvin-cfw.gattoux0.workers.dev;
            proxy_set_header Referer https://www.google.com/;
            proxy_set_header Origin https://www.cloudflare.com/;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /CxlvinTRWS {
            proxy_pass http://trojan_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVlWS {
            proxy_pass http://vless_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding off;
            proxy_read_timeout 300s;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinSSWS {
            proxy_pass http://shadowsocks_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVMWS {
            proxy_pass http://vmess_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_socket_keepalive on;
        }

        location ^~ /CxlvinTRHU {
            proxy_pass http://trojan_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVlHU {
            proxy_pass http://vless_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinSSHU {
            proxy_pass http://shadowsocks_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVMHU {
            proxy_pass http://vmess_hu;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_socket_keepalive on;
        }

        location ^~ /CxlvinTRXH {
            proxy_pass http://[::1]:10010;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVlXH {
            proxy_pass http://[::1]:10009;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinSSXH {
            proxy_pass http://[::1]:10012;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_socket_keepalive on;
        }
        location ^~ /CxlvinVMXH {
            proxy_pass http://[::1]:10011;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_socket_keepalive on;
        }
    }
}
